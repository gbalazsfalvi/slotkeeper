# The v1 runtime is a local, synthetic demonstration. TLS and real identity are future deployment work.
spring.application.name=slotkeeper
spring.main.banner-mode=off
server.port=${PORT:4190}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=NONE
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=16KB
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=30
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SLOTKEEPER_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SLOTKEEPER_SECURE_COOKIE:false}
spring.datasource.url=${SLOTKEEPER_DB_URL:jdbc:postgresql://127.0.0.1:55419/slotkeeper?currentSchema=slotkeeper}
spring.datasource.username=slotkeeper_app
spring.datasource.password=${SLOTKEEPER_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.connection-init-sql=SET statement_timeout='10s'
# Only the explicit one-shot migration process receives schema-owner credentials.
spring.flyway.enabled=false
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION
spring.session.timeout=30m
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
logging.level.org.springframework.security=warn
slotkeeper.maintenance-enabled=true
